
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Inventory System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1 style="grid-area: title; text-align: center; width: 100%; margin: 0;">BookNest Nigeria</h1>
        <p style="grid-area: intro; text-align: center; width: 100%; margin: 0 0 25px;">Manage Book Collection and Keep up to Date.</p>

        <section class="card">
            <h2 id="formTitle">Add to Collection</h2>

            <form id="bookForm">
                <input type="text" id="title"
                       placeholder="Book Title" required>

                <input type="text" id="author"
                       placeholder="Author" required>

                <input type="number" id="price"
                       placeholder="Price (₦)"
                       min="0.01" step="0.01" required>

                <button id="saveButton" type="submit">
                    Add to Collection
                </button>

                <button type="button" id="cancelButton" hidden>
                    Cancel Edit
                </button>
            </form>
        </section>

        <section class="card">
            <h2>Library Collection</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="bookTable"></tbody>
                </table>
            </div>
        </section>

        <p id="message" role="status"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
